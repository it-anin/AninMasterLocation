<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบ 9 — ลำแสงสาดลงจากเพดาน</title>
<link rel="stylesheet" href="base.css">
<style>
  /* ลำแสงสาดลงจากเพดานเหมือนไฟสปอตในโรงละคร
     กว้างออกด้านล่างตามธรรมชาติของแสง ไม่ใช่กรอบสี่เหลี่ยม
     ความ "ไม่พอดีขอบ" จึงกลายเป็นเรื่องปกติของแสง ไม่ใช่ข้อผิดพลาด */
  #beam { animation: shine .7s ease-out both; transform-box: fill-box; transform-origin: top center; }
  @keyframes shine {
    from { opacity: 0; transform: scaleY(.15); }
    to   { opacity: 1; transform: scaleY(1); }
  }
  #pool { animation: glow .5s .55s ease-out both; }
  @keyframes glow { from { opacity: 0; } to { opacity: 1; } }
  #dim { animation: dimIn .5s ease-out both; }
  @keyframes dimIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="pda">
  <div class="head"><b id="code"></b><span>ตำแหน่งจัดเก็บ</span></div>
  <div class="sub" id="sub"></div>

  <div class="card">
    <svg class="plan" viewBox="0 0 1280 417" role="img" aria-label="ผังคลัง">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#fde68a" stop-opacity=".85"/>
          <stop offset="100%" stop-color="#fde68a" stop-opacity=".12"/>
        </linearGradient>
      </defs>
      <image href="wh.jpg" x="0" y="0" width="1280" height="417"/>
      <rect id="dim" x="0" y="0" width="1280" height="417" fill="rgba(15,32,45,.42)"/>
      <path id="beam" fill="url(#bg)"/>
      <ellipse id="pool" fill="#fde68a" opacity=".5"/>
    </svg>
    <div class="note">
      ลำแสงสาดลงจากเพดาน บานออกด้านล่างตามธรรมชาติของแสง
      ความไม่พอดีขอบกลายเป็นเรื่องปกติของแสง ไม่ใช่ข้อผิดพลาด
    </div>
    <div id="picker"></div>
    <div id="rp"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
  let zone = DEMO.zone;
  function draw() {
    const cx = zoneMidX(zone), w = Math.max(54, zoneW(zone));
    const topW = w * 0.30, botW = w * 1.15;
    const yTop = 8, yBot = RACK_BOTTOM + 16;
    document.getElementById('beam').setAttribute('d',
      `M${cx - topW/2} ${yTop} L${cx + topW/2} ${yTop}
       L${cx + botW/2} ${yBot} L${cx - botW/2} ${yBot} Z`);
    const pool = document.getElementById('pool');
    pool.setAttribute('cx', cx); pool.setAttribute('cy', yBot);
    pool.setAttribute('rx', botW / 2); pool.setAttribute('ry', 13);
    document.getElementById('code').textContent = zone + DEMO.shelf + DEMO.slot;
    document.getElementById('sub').textContent =
      `โซน ${zone} · เชลฟ์ที่ ${DEMO.shelf} · ชั้นที่ ${DEMO.slot}`;
    replay();
  }
  function replay() {
    for (const id of ['beam', 'pool', 'dim']) {
      const el = document.getElementById(id);
      el.style.animation = 'none'; void el.getBoundingClientRect(); el.style.animation = '';
    }
  }
  draw();
  document.getElementById('picker').appendChild(zonePicker(z => { zone = z; draw(); }, zone));
  document.getElementById('rp').appendChild(replayBtn(replay));
</script>
</body>
</html>
