<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบ 8 — ชั้นวางสามมิติ (วาดด้วย SVG)</title>
<style>
  :root{--bg:#0f1720;--card:#17212b;--line:#2a3947;--ink:#e8eef4;--dim:#93a4b5;
        --ok:#22c55e;--accent:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Noto Sans Thai",system-ui,sans-serif}
  .pda{max-width:480px;margin:0 auto;padding:10px}
  .scan{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
        background:#0b1219;color:var(--ink);font-size:16px}
  .card{margin-top:10px;background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:12px}
  .head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .head b{font-size:44px;color:var(--ok);line-height:1}
  .head span{font-size:12px;color:var(--dim)}

  /* ชั้นวางเอียงแบบ isometric — ให้ความรู้สึกใกล้ภาพ render มากกว่าตารางแบน */
  svg.iso{display:block;width:100%;height:auto}
  .deck{fill:#8a603a}
  .deck-top{fill:#a9784b}
  .deck.on{fill:#15803d}
  .deck-top.on{fill:#22c55e}
  .post{fill:#3a4b5c}
  .lbl{fill:#93a4b5;font-size:15px;font-weight:700;font-family:system-ui,sans-serif;
       text-anchor:end;dominant-baseline:middle}
  .lbl.on{fill:#22c55e}
  .box{fill:#c9a882;stroke:#7a5433;stroke-width:1}
  .box.hit{fill:#22c55e;stroke:#fff;stroke-width:2}
  .tag{fill:#04220f;font-size:13px;font-weight:800;font-family:system-ui,sans-serif;
       text-anchor:middle;dominant-baseline:middle}

  .note{margin-top:8px;font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
  .name{margin-top:10px;font-size:17px;font-weight:600;line-height:1.35}
  .meta{margin-top:6px;font-size:12px;color:var(--dim)}
  .btn{margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;
       background:var(--accent);color:#04202b;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div class="pda">
  <input class="scan" placeholder="ยิงบาร์โค้ดได้เลย">
  <div class="card">
    <div class="head"><b id="code"></b><span id="sub"></span></div>
    <svg class="iso" id="iso" viewBox="0 0 400 330" role="img" aria-label="ชั้นวางสามมิติ"></svg>
    <div class="note"><span>ชั้น 1 = ล่างสุด</span><span id="cnt"></span></div>
    <div class="name" id="name"></div>
    <div class="meta" id="meta"></div>
    <button class="btn">✏️ แก้ไขตำแหน่ง</button>
  </div>
</div>

<script src="shared.js"></script>
<script>
  const d = DEMO, n = slotsOf(d.zone);
  document.getElementById('code').textContent = d.code;
  document.getElementById('sub').textContent =
    `โซน ${d.zone} · ชั้น ${d.shelf} · ช่อง ${d.slot}`;
  document.getElementById('cnt').textContent = `${n} ช่องต่อชั้น`;

  // isometric: x เลื่อนขวา, y เลื่อนลง, ความลึกเอียงขึ้นซ้าย
  const X0 = 58, Y0 = 296, W = 300, DX = 44, DY = -26, SH = 40;
  const p = (x,y) => `${x},${y}`;
  let out = '';

  for (let s = 1; s <= SHELVES; s++) {
    const on = s === d.shelf;
    const y = Y0 - (s-1)*SH;

    // แผ่นชั้น (หน้า + ด้านบนเอียง)
    out += `<polygon class="deck${on?' on':''}" points="${p(X0,y)} ${p(X0+W,y)} ${p(X0+W,y+7)} ${p(X0,y+7)}"/>`;
    out += `<polygon class="deck-top${on?' on':''}" points="${p(X0,y)} ${p(X0+W,y)} ${p(X0+W+DX,y+DY)} ${p(X0+DX,y+DY)}"/>`;
    out += `<text class="lbl${on?' on':''}" x="${X0-10}" y="${y-8}">${s}</text>`;

    // กล่องบนชั้น — วางเรียงตามความกว้าง
    const bw = (W - 10) / n;
    for (let i = 0; i < n; i++) {
      const hit = on && i+1 === d.slot;
      const bx = X0 + 5 + i*bw, bh = hit ? 26 : 20;
      out += `<rect class="box${hit?' hit':''}" x="${bx+2}" y="${y-bh}" width="${bw-4}" height="${bh}" rx="2"/>`;
      if (hit) out += `<text class="tag" x="${bx+bw/2}" y="${y-bh/2}">${d.code}</text>`;
    }
  }
  // เสาตั้ง
  out += `<rect class="post" x="${X0-4}" y="${Y0-SHELVES*SH+10}" width="6" height="${SHELVES*SH}"/>`;
  out += `<rect class="post" x="${X0+W-2}" y="${Y0-SHELVES*SH+10}" width="6" height="${SHELVES*SH}"/>`;

  document.getElementById('iso').innerHTML = out;
  document.getElementById('name').textContent = d.name;
  document.getElementById('meta').textContent = `${d.item_id} · ${d.unit} · ${d.barcode}`;
</script>
</body>
</html>
