<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ไฮไลท์โซน อนิเมชัน ชุดที่ 2 — 10 แบบ</title>
<style>
  :root { --bg:#0f1720; --card:#17212b; --line:#2a3947; --ink:#e8eef4; --dim:#93a4b5; --accent:#38bdf8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Noto Sans Thai",system-ui,sans-serif; padding:20px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .lead { color:var(--dim); font-size:14px; line-height:1.7; margin-bottom:16px; }
  .nav { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .nav a { color:var(--accent); text-decoration:none; font-size:13px;
           border:1px solid var(--line); border-radius:7px; padding:5px 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:18px; }
  .item { background:var(--card); border:1px solid var(--line); border-radius:12px;
          overflow:hidden; display:flex; flex-direction:column; }
  .item h2 { font-size:14px; margin:0; padding:10px 12px; border-bottom:1px solid var(--line);
             display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .item h2 a { color:var(--accent); text-decoration:none; font-size:12px; font-weight:400; white-space:nowrap; }
  .item p { margin:0; padding:9px 12px; font-size:12px; color:var(--dim);
            line-height:1.65; border-bottom:1px solid var(--line); min-height:74px; }
  .frame { background:#fff; height:450px; overflow:hidden; position:relative; }
  iframe { width:480px; height:940px; border:0; transform:scale(.64); transform-origin:top left;
           position:absolute; top:0; left:50%; margin-left:-154px; }
</style>
</head>
<body>
  <h1>ไฮไลท์โซน อนิเมชัน ชุดที่ 2 — 10 แบบ</h1>
  <div class="lead">
    ชุดที่ 3 ของทั้งหมด — ไม่ซ้ำกับ 20 แบบก่อนหน้า<br>
    ทุกแบบมีปุ่มสลับโซน A–K และปุ่ม <b>▶ เล่นซ้ำ</b>
  </div>

  <div class="nav">
    <a href="../zone/">← ชุดที่ 1 · แบบนิ่ง 10 แบบ</a>
    <a href="../zone-anim/">← ชุดที่ 2 · อนิเมชัน 10 แบบ</a>
  </div>

  <div class="grid" id="grid"></div>

<script>
  const items = [
    ['01-flashlight-dark.html','1 · ไฟฉายส่องในคลังมืด',
     'คลังมืดสนิทแล้วส่องไฟฉายกวาดหา คอนทราสต์สูงสุดในบรรดาทุกแบบ เห็นชัดแม้มองแวบเดียว'],
    ['02-stamp.html','2 · ตราประทับกระแทกลง',
     'ตราประทับเอียงๆ กระแทกลงแล้วสะเทือน ให้ความรู้สึก "ยืนยันแล้ว" ใช้สีแดงตัดกับเขียวของระบบ'],
    ['03-slot-machine.html','3 · ตัวอักษรหมุนแบบสล็อต',
     'ตัวอักษรหมุนไล่ A→K แล้วช้าลงจนหยุด ดึงสายตาไปที่ตัวอักษรซึ่งเป็นสิ่งที่ต้องจำไปหาของ'],
    ['04-ripple-wave.html','4 · คลื่นแผ่จากโซนออกไป',
     'คลื่นแนวตั้งแผ่ออกจากโซนไปสองข้าง เห็นชัดว่าโซนนี้คือจุดกำเนิด ไม่ลดความสว่างภาพเลย'],
    ['05-progress-walk.html','5 · ไอคอนคนเดินไปยังโซน',
     'คนเดินจากประตูไปหยุดที่โซนแล้วกระโดดเบาๆ เข้าใจทันทีโดยไม่ต้องอ่านตัวหนังสือ'],
    ['06-neon-outline.html','6 · เส้นนีออนวิ่งรอบโซน',
     'เส้นเรืองแสงวิ่งวนรอบกรอบเหมือนไฟวิ่งป้ายร้าน ใช้ stroke-dash จึงเบากว่าวาดใหม่ทุกเฟรม'],
    ['07-card-flip.html','7 · การ์ดพลิกเผยรหัส',
     'พลิก 3 มิติจากผังไปเป็นรหัสตัวใหญ่ เหมาะกับคนที่ต้องการรหัสเป็นหลัก แตะพลิกกลับได้'],
    ['08-magnify-glass.html','8 · แว่นขยายเลื่อนมาส่อง',
     'แว่นเลื่อนมาหยุดที่โซน ในวงเห็นภาพขยายจริง ต่างจากซูมทั้งจอ — ยังเห็นผังรวมรอบๆ'],
    ['09-typewriter.html','9 · พิมพ์รหัสทีละตัว',
     'พิมพ์ทีละหลักพร้อมไฮไลท์ไล่ตามขั้น (โซน → เชลฟ์ → ชั้น) สอนให้รู้ว่าแต่ละหลักคืออะไร'],
    ['10-blueprint.html','10 · พิมพ์เขียววาดเส้นทีละเส้น',
     'เส้นวาดตัวเองทีละเส้นบนพื้นน้ำเงิน แล้วโซนเป้าหมายสว่างเขียว อ่านง่ายแม้จอสู้แสงไม่ไหว'],
    ['11-walk-path-icon.html','11 · คนเดินตามเส้นทาง ⭐ รวม 2 แบบ',
     'รวมเส้นทางเดิน (ชุด 2 แบบ 4) กับไอคอนคนเดิน (ชุด 3 แบบ 5) — คนเดินตามเส้นจริงๆ ขาสลับตอนเดิน ถึงแล้วกระโดดพร้อมธงบอกโซน'],
  ];
  document.getElementById('grid').innerHTML = items.map(([f,t,d]) =>
    `<div class="item">
       <h2>${t}<a href="${f}" target="_blank">เปิดเต็มจอ ↗</a></h2>
       <p>${d}</p>
       <div class="frame"><iframe src="${f}" loading="lazy" title="${t}"></iframe></div>
     </div>`).join('');
</script>
</body>
</html>
