<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบ 2 — รหัสยักษ์เต็มจอ</title>
<style>
  :root{--bg:#04140b;--ink:#eafff1;--dim:#7fbf98;--ok:#22c55e;--line:#14532d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Noto Sans Thai",system-ui,sans-serif}
  .pda{max-width:480px;margin:0 auto;padding:10px;min-height:100vh;display:flex;flex-direction:column}
  .scan{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
        background:#021007;color:var(--ink);font-size:16px}

  /* ทั้งจอมีหน้าที่เดียว: บอกรหัสให้อ่านได้จากอีกฝั่งของทางเดิน */
  .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:18px 0;text-align:center}
  .hero .zone{font-size:15px;color:var(--dim);letter-spacing:2px}
  .hero .code{font-size:108px;line-height:.95;font-weight:800;color:var(--ok);
              letter-spacing:2px;text-shadow:0 0 26px rgba(34,197,94,.3)}

  /* แยกรหัสให้เห็นว่าแต่ละหลักคืออะไร — กันอ่านผิดว่า "ชั้น 32" */
  .parts{margin-top:14px;display:flex;gap:8px}
  .part{min-width:88px;padding:8px 10px;border-radius:10px;background:#07200f;
        border:1px solid var(--line)}
  .part i{display:block;font-style:normal;font-size:11px;color:var(--dim)}
  .part b{display:block;font-size:26px;color:var(--ink);line-height:1.2}

  .strip{margin-top:18px;display:flex;flex-direction:column-reverse;gap:3px;width:100%;max-width:300px}
  .row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
  .row .lab{width:16px;text-align:right}
  .row .track{flex:1;height:16px;border-radius:4px;background:#07200f;border:1px solid var(--line)}
  .row.on .track{background:var(--ok)}
  .row.on .lab{color:var(--ok);font-weight:700}

  .foot{padding:10px 0;font-size:13px;color:var(--dim);text-align:center;line-height:1.5}
  .btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ok);
       color:#03200f;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div class="pda">
  <input class="scan" placeholder="ยิงบาร์โค้ดได้เลย">

  <div class="hero">
    <div class="zone">ตำแหน่งจัดเก็บ</div>
    <div class="code" id="code"></div>

    <div class="parts">
      <div class="part"><i>โซน</i><b id="p1"></b></div>
      <div class="part"><i>ชั้น (ล่าง→บน)</i><b id="p2"></b></div>
      <div class="part"><i>ช่อง</i><b id="p3"></b></div>
    </div>

    <div class="strip" id="strip"></div>
  </div>

  <div class="foot" id="foot"></div>
  <button class="btn">✏️ แก้ไขตำแหน่ง</button>
</div>

<script src="shared.js"></script>
<script>
  const d = DEMO;
  document.getElementById('code').textContent = d.code;
  document.getElementById('p1').textContent = d.zone;
  document.getElementById('p2').textContent = d.shelf;
  document.getElementById('p3').textContent = d.slot;

  const strip = document.getElementById('strip');
  for (let s = 1; s <= SHELVES; s++) {
    const r = document.createElement('div');
    r.className = 'row' + (s === d.shelf ? ' on' : '');
    r.innerHTML = `<span class="lab">${s}</span><span class="track"></span>`;
    strip.appendChild(r);
  }

  document.getElementById('foot').innerHTML =
    `${d.name}<br>${d.item_id} · ${d.unit} · ${d.barcode}`;
</script>
</body>
</html>
