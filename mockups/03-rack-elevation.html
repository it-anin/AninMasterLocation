<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบ 3 — ภาพด้านหน้าชั้นวาง</title>
<style>
  :root{--bg:#0f1720;--card:#17212b;--line:#2a3947;--ink:#e8eef4;--dim:#93a4b5;
        --ok:#22c55e;--wood:#a9784b;--wood2:#8a603a;--accent:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Noto Sans Thai",system-ui,sans-serif}
  .pda{max-width:480px;margin:0 auto;padding:10px}
  .scan{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
        background:#0b1219;color:var(--ink);font-size:16px}
  .card{margin-top:10px;background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:12px}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .head b{font-size:40px;color:var(--ok);line-height:1}
  .head span{font-size:12px;color:var(--dim);text-align:right;line-height:1.5}

  /* วาดชั้นวางตรงๆ แบบมองจากด้านหน้า — ตรงกับสิ่งที่พนักงานเห็นเมื่อยืนหน้าชั้น */
  .rack{border:2px solid #3a4b5c;border-radius:6px;overflow:hidden;background:#0c141b}
  .shelf{display:flex;align-items:stretch;border-top:3px solid var(--wood2);height:46px}
  .shelf:first-child{border-top:0}
  .shelf .num{width:34px;flex:none;display:grid;place-items:center;background:#101a23;
              border-right:1px solid var(--line);font-weight:700;font-size:15px;color:var(--dim)}
  .shelf .cells{flex:1;display:flex;gap:3px;padding:4px}
  .cell{flex:1;border-radius:4px;background:var(--wood);opacity:.5;
        display:grid;place-items:center;font-size:10px;color:#2b1a0c;font-weight:700}
  .shelf.on{background:rgba(34,197,94,.08)}
  .shelf.on .num{background:var(--ok);color:#04220f}
  .shelf.on .cell{opacity:.85}
  .cell.hit{opacity:1;background:var(--ok);color:#04220f;
            box-shadow:inset 0 0 0 2px #fff, 0 0 10px rgba(34,197,94,.6)}
  .floor{height:10px;background:linear-gradient(#2a3947,#1b2530)}

  .hintline{margin-top:8px;font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
  .name{margin-top:12px;font-size:17px;font-weight:600;line-height:1.35}
  .meta{margin-top:6px;font-size:12px;color:var(--dim)}
  .btn{margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;
       background:var(--accent);color:#04202b;font-size:15px;font-weight:700}
</style>
</head>
<body>
<div class="pda">
  <input class="scan" placeholder="ยิงบาร์โค้ดได้เลย">
  <div class="card">
    <div class="head">
      <b id="code"></b>
      <span id="sub"></span>
    </div>

    <div class="rack" id="rack"></div>
    <div class="floor"></div>
    <div class="hintline"><span>มองจากด้านหน้าชั้น</span><span>ชั้น 1 = ล่างสุด</span></div>

    <div class="name" id="name"></div>
    <div class="meta" id="meta"></div>
    <button class="btn">✏️ แก้ไขตำแหน่ง</button>
  </div>
</div>

<script src="shared.js"></script>
<script>
  const d = DEMO;
  document.getElementById('code').textContent = d.code;
  document.getElementById('sub').innerHTML =
    `โซน ${d.zone}<br>ชั้น ${d.shelf} · ช่อง ${d.slot}`;

  // ไล่จากชั้นสูงลงล่าง เพราะ DOM เรียงบนลงล่างตามธรรมชาติ
  const rack = document.getElementById('rack');
  const n = slotsOf(d.zone);
  for (let s = SHELVES; s >= 1; s--) {
    const on = s === d.shelf;
    const cells = Array.from({length:n}, (_,i) => {
      const hit = on && i+1 === d.slot;
      return `<div class="cell${hit?' hit':''}">${hit ? code(d.zone,s,i+1) : ''}</div>`;
    }).join('');
    const row = document.createElement('div');
    row.className = 'shelf' + (on ? ' on' : '');
    row.innerHTML = `<div class="num">${s}</div><div class="cells">${cells}</div>`;
    rack.appendChild(row);
  }

  document.getElementById('name').textContent = d.name;
  document.getElementById('meta').textContent = `${d.item_id} · ${d.unit} · ${d.barcode}`;
</script>
</body>
</html>
